[project]
name = "freesolo-flash"
version = "1.1.70"
description ="Flash — managed LoRA post-training (SFT/GRPO/OPD) for Freesolo environments, driven by the `flash` CLI"
readme = "README.md"
# RunPod Flash supports Python 3.11-3.12 (not 3.13 yet).
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Freesolo" }]
keywords = ["llm", "rl", "grpo", "sft", "lora", "fine-tuning", "freesolo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
# The client CLI is pure standard library (urllib + tomllib + argparse): `pip install freesolo-flash`
# pulls NOTHING. Every runtime dep below is server/worker-side and lives in an extra (`server`
# for the control plane, `gpu` for the local worker). Verified: all client commands run with
# httpx/huggingface-hub/datasets/freesolo uninstalled.
dependencies = []

[project.optional-dependencies]
# heavy deps for running the fine-tuning worker locally (on the gpu worker these are
# installed by runpod flash from the dependency list in flash/providers/_lifecycle/worker.py).
gpu = [
    "torch==2.10.0",
    "transformers>=5.6,<5.13",
    "tokenizers>=0.22",
    "tiktoken>=0.12",
    "peft>=0.19",
    "vllm==0.19.1",
    "bitsandbytes>=0.49",
    "accelerate>=1.4",
    # resolve_verl_python shells out to `uv` to provision the isolated verl interpreter whenever
    # FLASH_VERL_PYTHON is unset. sft and opd are verl-only, so that call is unconditional here.
    "uv>=0.5",
    # Worker runtime: Freesolo environment loading and HF checkpoint I/O.
    "datasets>=2.19",
    "freesolo>=0.4.1",
    "huggingface-hub>=1.2.0",
]
# Control-plane / operator deps. runpod-flash (RunPod provider SDK) + huggingface-hub (provider
# code upload + repo settings) are imported server-side; httpx is the serving client (flash/serve).
# Keeping runpod-flash out of the base install also stops its `flash` console script shadowing
# ours, so `pip install freesolo-flash` gives an unambiguous `flash` command. huggingface-hub>=1.2.0:
# 1.2.0+ adds built-in RateLimit-header-aware 429 retry for downloads (resolvers) and paginated Hub
# API calls. Our outer _hf_call wrappers stay on top: the library does not retry the complete mutating
# operations (create_commit / create_repo / update_repo_settings) and the wrappers also bound an
# overall deadline. (>=0.34 was already required for upload_code()'s update_repo_settings(private=True);
# 0.25.x only accepts `gated` and raises TypeError on `private`.)
# sft cost, dry-run, and submit statically read packaged rows plus the defined training contract.
# environment.py is not imported; other environment prompt transformations remain estimate gaps.
server = [
    "fastapi",
    "uvicorn",
    "runpod-flash",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "referencing>=0.28.4",
    "regex>=2024.11.6",
    "huggingface-hub>=1.2.0",
    "datasets>=2.19",
    "freesolo>=0.4.1",
    "transformers>=5.6,<5.13",
    # the control plane decodes images: flash/server/routes/runs.py imports
    # preflight_validate_image_opd at module load, and flash/content/multimodal.py opens every image
    # source with PIL to validate it. without Pillow a self-hoster on [server] gets
    # `RuntimeError: Pillow is required for multimodal image training` at preflight on any
    # multimodal opd run. the gpu extra gets Pillow transitively via vllm; server does not.
    "pillow>=11",
]
# CI compatibility: some workflows use `uv sync --extra dev` rather than `--group dev`.
dev = [
    "mypy>=1.13.0",
    "pytest>=9.0.3",
    # Upper bound tracks uv.lock (ruff 0.16.x), which is what CI lints with. Without it, an
    # install that ignores the lockfile (`uv pip install -e '.[dev]'`, plain pip) resolves whatever
    # ruff is newest, whose added rules fail on a tree CI calls clean. Raise both sites together
    # with the lockfile, never ahead of it.
    "ruff>=0.6,<0.17",
    "fastapi",
    "uvicorn",
    "runpod-flash",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "referencing>=0.28.4",
    "regex>=2024.11.6",
    "huggingface-hub>=1.2.0",
    "datasets>=2.19",
    "freesolo>=0.4.1",
    "transformers>=5.6,<5.13",
    "tokenizers>=0.22",
    "tiktoken>=0.12",
    # flash/content/multimodal.py imports PIL directly to validate and decode every image source, so the
    # image tests are not optional coverage: without Pillow they importorskip and CI reports green
    # on a multimodal path it never executed. the control plane decodes images too, so `server`
    # declares Pillow as well; this entry keeps the tests runnable without that extra.
    "pillow>=11",
]
# NB: there is deliberately no `all` aggregate. `gpu` (the GPU worker) and `server` (the control
# plane) run on separate machines.

[project.urls]
Homepage = "https://github.com/freesolo-co/flash"
Repository = "https://github.com/freesolo-co/flash"

[project.scripts]
flash = "flash.cli:main"
# Same entry point as `flash`, under a name nothing else claims. The `server` and `dev` extras
# pull in runpod-flash, which declares its own `flash` console script; whichever distribution is
# installed last wins, so on a plane host `flash` can silently belong to runpod-flash. `flash-cli`
# always reaches Flash. Keep both: on a base install `flash` is unambiguous and is what every
# existing user has.
flash-cli = "flash.cli:main"
# Operator-only: the control plane is a separate service, run once on the host, not a `flash`
# subcommand. Requires the `server` extra (`pip install 'freesolo-flash[server]'`).
flash-server = "flash.server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flash"]
# Ship the PEP 561 marker so downstream type checkers pick up Flash's type hints.
artifacts = ["flash/py.typed"]

[tool.flash-dev]
# Version of the dev-channel package `freesolo-flash-dev` (the `flash-dev` CLI, which defaults to
# the staging plane flash-dev.freesolo.co). It MUST equal [project].version above (the prod
# `freesolo-flash`) — the two channels ship in lockstep; .github/workflows/version-parity.yml fails
# CI if they diverge. The dev channel is built from this same source by scripts/build_dev_dist.py and
# auto-published by .github/workflows/publish-dev.yml: a push to `dev` whose version isn't yet on
# PyPI publishes it; pushes that don't change it find it already published and no-op. So cutting a
# dev-channel release = bump this (and [project].version) and merge to `dev`.
version = "1.1.70"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "live: hits real provider APIs; opt in with FLASH_LIVE=1 (plus provider creds)",
  # These assert on REAL elapsed time -- they sleep instead of faking the clock, to prove the
  # shutdown path actually reserves its cleanup budget before the watchdog deadline. Their margins
  # are tens of milliseconds, which is smaller than one scheduler preemption, so they fail if
  # another test process is competing for the core. CI therefore runs the suite with `-n 2` while
  # DESELECTING this marker, then runs the marked tests alone in a second, serial pass (~5s).
  # Prefer a fake clock in new tests; add this marker only when real elapsed time IS the assertion.
  "wallclock: asserts on real elapsed time; must run serially, never alongside another worker",
]

[tool.uv]
# Heavy GPU extras are worker-side; keep the default sync light.
package = true

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "pytest>=9.0.3",
    # Keep in lockstep with the `dev` extra above and with uv.lock.
    "ruff>=0.6,<0.17",
    # Offline worker/env tests import these without the heavy `gpu` stack; the CI test env
    # (`--extra server --dev`) gets httpx + huggingface-hub from the `server` extra.
    "datasets>=2.19",
    "freesolo>=0.4.1",
    "tokenizers>=0.22",
    "tiktoken>=0.12",
    # flash/content/multimodal.py imports PIL directly to validate and decode every image source, so the
    # image tests are not optional coverage: without Pillow they importorskip and CI reports green
    # on a multimodal path it never executed. the control plane decodes images too, so `server`
    # declares Pillow as well; this entry keeps the tests runnable without that extra.
    "pillow>=11",
    "pytest-xdist>=3.6",
    # tests/test_workflow_contracts.py parses .github/workflows/*.yml. PyYAML is already present
    # transitively (datasets/transformers/huggingface-hub), but a test that imports it directly
    # must declare it: otherwise dropping one of those unrelated deps turns the workflow contract
    # tests into a collection error, and the invariants they pin stop being checked.
    "pyyaml>=6",
]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_configs = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "uv-cache"]

[tool.ruff.lint]
# Shared strict ruleset. The select/ignore lists below are byte-identical in flash and in freesolo
# (backend, agent, serving) so a fix that satisfies one repo satisfies the other; change them in
# every copy or in none. Only per-file-ignores differ, since those name paths in one repo.
#
# Beyond the original set (pycodestyle, pyflakes, import sort, pyupgrade, bugbear, comprehensions,
# simplify, returns, ruff-specific, perf, pytest-style, fastapi, async, datetime-zone) this adds:
#   N     pep8-naming            ICN   import conventions      A     builtin shadowing
#   ISC   implicit str concat    G     logging format          EXE   shebang/exec bits
#   PIE   misc lints             Q     quote consistency       INT   gettext
#   PYI   stub/typing shape      RSE   raise cleanliness       YTT   sys.version checks
#   SLOT  __slots__ on subclass  FLY   static join -> f-string ERA   commented-out code
#   LOG   logging misuse         TID   tidy imports            PGH   blanket noqa/type-ignore
#   TC    typing-only imports
select = [
  "E", "W", "F", "I", "UP", "B", "C4", "SIM", "RET", "RUF", "PERF", "PT", "FAST", "ASYNC", "DTZ",
  "N", "ISC", "ICN", "G", "PIE", "PYI", "Q", "RSE", "SLOT", "FLY", "LOG", "A", "EXE", "INT", "YTT",
  "ERA", "PGH", "TC", "TID",
]
ignore = [
  # E501 (line length) is reported by the formatter's own wrapping; keep long descriptive comments
  # and strings without churn.
  "E501",
  # FastAPI/Typer signatures are built on `= Depends(...)` / `= Argument(...)` defaults by design.
  "B008",
  # Naming: these fire on deliberate house conventions, not defects.
  #   `torch.nn.functional as F` and similar canonical aliases, ALL_CAPS locals for
  #   module-level-ish pins, and internal exceptions named for the condition (`_RunCancelled`)
  #   rather than `...Error`.
  "N802", "N803", "N806", "N811", "N812", "N815", "N818",
  # TC would push runtime-needed imports into `if TYPE_CHECKING`, which breaks the places that
  # resolve annotations at runtime (pydantic models, FastAPI signatures, get_type_hints).
  "TC001", "TC002", "TC003",
  # Mirroring a stdlib/third-party signature (`dir=` on mkdtemp, `requests`' own ConnectionError)
  # requires shadowing the builtin name; renaming would break the call it is standing in for.
  "A002",
  # Sibling modules inside a package are imported relatively on purpose.
  "TID252",
]

[tool.ruff.lint.per-file-ignores]
# Tests do sys.path hacks, importlib.reload, and intentional broad excepts.
"tests/*" = [
  "E402", "B011", "F841",
  # Explanatory prose in test bodies reads as commented-out code to ERA.
  "ERA001",
  # Fakes stand in for real context managers/namedtuples; they are not typing stubs.
  "PYI024", "PYI034",
  # A test may shadow a builtin to mirror the signature it patches.
  "A001", "A004",
  # Config fixtures are built as one line-per-key join so the TOML stays readable; an f-string
  # would collapse them into one long literal.
  "FLY002",
]
# Routes live inside the create_app() closure; with PEP 563 lazy annotations,
# Annotated[..., Depends(closure_local)] cannot be resolved by get_type_hints,
# so the definition-time `= Depends(...)` form is required here.
"flash/server/app.py" = ["FAST002"]
# `_ScoredResponseText` subclasses `str` to stay grader-compatible while carrying the structured
# views as attributes; __slots__ would defeat that.
"flash/envs/adapter.py" = ["SLOT000"]
