[project]
name = "freesolo-flash"
version = "0.2.34"
description = "Flash — managed LoRA post-training (SFT/GRPO) for Freesolo environments, driven by the `flash` CLI"
readme = "README.md"
# RunPod Flash supports Python 3.11-3.12 (not 3.13 yet).
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Freesolo" }]
keywords = ["llm", "rl", "grpo", "sft", "lora", "fine-tuning", "freesolo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
# The client CLI is pure standard library (urllib + tomllib + argparse): `pip install freesolo-flash`
# pulls NOTHING. Every runtime dep below is server/worker-side and lives in an extra (`server`
# for the control plane, `gpu` for the local worker). Verified: all client commands run with
# httpx/huggingface-hub/datasets/freesolo uninstalled.
dependencies = []

[project.optional-dependencies]
# Heavy deps for running the fine-tuning worker locally (on the GPU worker these are
# installed by RunPod Flash via WORKER_DEPS in flash/flash/train.py).
gpu = [
    "torch==2.10.0",
    "transformers>=5.6,<5.11",
    "trl>=1.6,<1.7",
    "peft>=0.19",
    "vllm==0.19.1",
    "bitsandbytes>=0.49",
    "accelerate>=1.4",
    # Worker runtime: Freesolo environment loading and HF checkpoint I/O.
    "datasets>=2.19",
    "freesolo>=0.2.52",
    "huggingface-hub>=0.34",
]
# freesolo-chalk (Freesolo's custom Triton/CUDA kernels, complements Liger) is an OPTIONAL,
# separately-installed package — it is not on PyPI yet, so it is deliberately NOT a hard
# dependency here (that would break resolution). flash auto-detects it at runtime and no-ops
# when it's absent (see flash/engine/chalk_kernels.py). chalk is install-on-call (it reads NO env
# vars), so the worker selects kernels via per-kernel FLASH_* flags. Enable on a remote run by
# setting the FLASH_* kernel flag(s) AND FLASH_CHALK_SPEC=<installable chalk spec> (git URL with
# access, or a wheel); the submit path appends that spec to the worker's extra_pip, which is
# installed for every job (works on the default baked-image path, unlike FLASH_WORKER_EXTRA_DEPS).
# Control-plane / operator deps. runpod-flash (RunPod provider SDK) + huggingface-hub (provider
# code upload + repo settings) are imported server-side; httpx is the serving client (flash/serve).
# Keeping runpod-flash out of the base install also stops its `flash` console script shadowing
# ours, so `pip install freesolo-flash` gives an unambiguous `flash` command. huggingface-hub>=0.34:
# upload_code()'s update_repo_settings(private=True) needs the visibility-via-settings API
# (0.25.x only accepts `gated` and raises TypeError on `private`).
# freesolo + datasets: the control plane CHARGES the run at submit (server/billing.charge_run_estimate),
# and for an SFT run with no [train].max_examples cap that estimate loads/counts the env's real train
# split (cost.spec.count_env_examples -> envs.load_environment -> the Freesolo adapter), so the server
# needs the env-loading stack too -- not just the GPU worker.
server = [
    "fastapi",
    "uvicorn",
    "runpod-flash",
    "httpx>=0.27",
    "huggingface-hub>=0.34",
    "datasets>=2.19",
    "freesolo>=0.2.52",
    "transformers>=5.6,<5.11",
]
# CI compatibility: some workflows use `uv sync --extra dev` rather than `--group dev`.
dev = [
    "mypy>=1.13.0",
    "pytest>=9.0.3",
    "ruff>=0.6",
    "fastapi",
    "uvicorn",
    "runpod-flash",
    "httpx>=0.27",
    "huggingface-hub>=0.34",
    "datasets>=2.19",
    "freesolo>=0.2.52",
    "transformers>=5.6,<5.11",
]
# NB: there is deliberately no `all` aggregate. `gpu` (the GPU worker) and `server` (the control
# plane) run on separate machines.

[project.urls]
Homepage = "https://github.com/freesolo-co/flash"
Repository = "https://github.com/freesolo-co/flash"

[project.scripts]
flash = "flash.cli:main"
# Operator-only: the control plane is a separate service, run once on the host, not a `flash`
# subcommand. Requires the `server` extra (`pip install 'freesolo-flash[server]'`).
flash-server = "flash.server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flash"]
# Ship the PEP 561 marker so downstream type checkers pick up Flash's type hints.
artifacts = ["flash/py.typed"]

[tool.flash-dev]
# Version of the dev-channel package `freesolo-flash-dev` (the `flash-dev` CLI, which defaults to
# the staging plane flash-dev.freesolo.co). It MUST equal [project].version above (the prod
# `freesolo-flash`) — the two channels ship in lockstep; .github/workflows/version-parity.yml fails
# CI if they diverge. The dev channel is built from this same source by scripts/build_dev_dist.py and
# auto-published by .github/workflows/publish-dev.yml: a push to `dev` whose version isn't yet on
# PyPI publishes it; pushes that don't change it find it already published and no-op. So cutting a
# dev-channel release = bump this (and [project].version) and merge to `dev`.
version = "0.2.34"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "live: hits real provider APIs; opt in with FLASH_LIVE=1 (plus provider creds)",
]

[tool.uv]
# Heavy GPU extras are worker-side; keep the default sync light.
package = true

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "pytest>=9.0.3",
    "ruff>=0.6",
    # Offline worker/env tests import these without the heavy `gpu` stack; the CI test env
    # (`--extra server --dev`) gets httpx + huggingface-hub from the `server` extra.
    "datasets>=2.19",
    "freesolo>=0.2.52",
]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_configs = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "uv-cache"]

[tool.ruff.lint]
# Matches the backend/agent convention: pycodestyle, pyflakes, import sort,
# pyupgrade, bugbear, comprehensions, simplify, returns, ruff-specific, perf,
# pytest-style, fastapi, async, datetime-zone.
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RET", "RUF", "PERF", "PT", "FAST", "ASYNC", "DTZ"]
# E501 (line length) is reported but not enforced as hard failure here; keep code tidy
# without churn on long, descriptive comments/strings.
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# Tests do sys.path hacks, importlib.reload, and intentional broad excepts.
"tests/*" = ["E402", "B011", "F841"]
# Routes live inside the create_app() closure; with PEP 563 lazy annotations,
# Annotated[..., Depends(closure_local)] cannot be resolved by get_type_hints,
# so the definition-time `= Depends(...)` form is required here.
"flash/server/app.py" = ["FAST002"]
