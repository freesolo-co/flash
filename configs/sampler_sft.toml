# Self-CTRL biased-sampler — Phase 1: SFT warm-start.
# Teaches the <predict>/<samples> output format and a self-consistent demonstration
# (the env's gold `answer`). Run this first, then warm-start GRPO from its adapter.
model = "Qwen/Qwen3.5-4B"   # paper used Llama 3.1 8B; Qwen3.5-9B (QLoRA) is the larger option
algorithm = "sft"

[environment]
id = "your-org/selfctrl-sampler"   # set to the slug printed by `slm env push`

[train]
hf_repo = "your-org/selfctrl-runs"   # HF repo for adapters/checkpoints (REQUIRED)
epochs = 2
lora_rank = 32
lora_alpha = 64
max_length = 1024
seeds = [0]

[gpu]
type = "RTX 5090"
