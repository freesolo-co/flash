# Flash GRPO benchmark: Qwen3.5-4B on hendrycks-math.
# Matched to the Tinker side: 30 steps, group_size=4, batch_size=4, max_tokens=1024.
# 4B GRPO needs >=35 GB VRAM, so the allocator escalates RTX 5090 -> A100 PCIe.
# (Competition math is harder than GSM8K; 30 steps shows direction, not convergence.)

model = "Qwen/Qwen3.5-4B"
algorithm = "grpo"

[environment]
id = "primeintellect/hendrycks-math"

[train]
steps            = 30
group_size       = 4
batch_size       = 4
max_tokens       = 1024
hf_repo          = "DavidBShan/flash-bench-hendrycks-math-4b"

[gpu]
# Asks the allocator for the cheapest *available* class that fits (4B GRPO needs >=35 GB),
# across all providers — no validation gate, no provider pin. The exact card and price are
# market/availability-driven and vary per run (the recorded benchmark ran on A100 PCIe).
requested = "cheapest"
