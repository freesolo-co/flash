name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

# A public repo takes a full run on every push to every fork PR branch. Without this, a
# superseded run keeps a runner for the whole suite while its replacement queues behind it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + offline tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # The suite is CPU-only and finishes well inside this; the cap is here so a wedged run
    # releases its runner instead of holding it for the 6-hour default.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares `requires-python = ">=3.11,<3.13"`, so both supported interpreters
        # are tested. Testing only 3.11 let a 3.12-only failure reach a user the project claims
        # to support.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # pin the installed binary as well as the action implementation.
          version: "0.12.5"
          python-version: ${{ matrix.python-version }}

      - name: Sync (server extra + dev)
        run: uv sync --extra server --extra serving --dev --locked

      - name: Ruff check
        run: uv run ruff check .

      # The formatter was never gated, so 102 files had drifted out of `ruff format` shape while
      # CI stayed green. Enforcing it here keeps that from happening again; freesolo's backend job
      # runs the same two commands against the same shared config.
      - name: Ruff format check
        run: uv run ruff format --check .

      # Ruff has no file-length rule, so the 1000-line limit on `flash/` is enforced separately.
      - name: File size check
        run: uv run python scripts/check_file_size.py

      # The file gate alone leaves a 700-line function room to hide inside a 900-line module, so
      # the 150-line limit on functions is gated too.
      - name: Function size check
        run: uv run python scripts/check_function_size.py

      # Keep the source hierarchy reviewable: no directory may exceed ten tracked files, and package
      # roots may mix subdirectories only with the three required marker files.
      - name: Source layout check
        run: uv run python scripts/check_source_layout.py

      # The job has always been NAMED offline (tests/conftest.py stubs the network boundaries in
      # Python), but nothing enforced it, so a test that reached hf.co passed on a connected
      # runner and would go red on a blip. Setting these makes the name true: an unstubbed call
      # fails locally and deterministically instead of intermittently in CI.
      #
      # Sharding: this step is ~300s of the job's ~305s, and almost all of it is waiting rather
      # than computing (the offline tests exercise retry/backoff/watchdog paths, so 125 sleep call
      # sites sit idle holding a core). One process left the runner's second core idle for five
      # minutes; `-n 2` cuts the step roughly in half.
      #
      # `loadfile` (not the default `load`, and not `loadscope`) is required, not a preference:
      # tests in the same FILE share module-level import state -- several re-import
      # `flash.engine.worker` to re-run its import scope, and others patch dotted targets under it.
      # Splitting a file across workers breaks that sharing; `loadscope` splits at class/module
      # granularity and fails tests/test_warmstart_cross_repo.py for exactly this reason. `loadfile`
      # keeps every file whole on one worker, which is the boundary the suite already assumes.
      #
      # `-n 2` is pinned deliberately instead of `-n auto`. `auto` does NOT mean "the cores this
      # process may use": xdist prefers psutil.cpu_count() when psutil is importable (it is, via a
      # transitive dep) and that ignores CPU affinity and cgroup limits. So `auto` silently couples
      # the worker count to a transitive dependency and to whatever tier the runner pool hands out.
      # A standard GitHub runner is 2-core, which is what this suite was measured against; pinning
      # keeps the sharding identical on every run instead of changing under us.
      #
      # Oversubscription is not free here: at 48 workers on 2 cores, three timing-sensitive tests in
      # tests/test_server_envs_coverage.py fail, because they assert on a schema-validation timeout
      # budget that CPU starvation blows through. Raise this only alongside the runner's core count.
      - name: Tests (CPU, offline)
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: uv run pytest -q -n 2 --dist loadfile -m "not wallclock"

      # The `wallclock` tests assert on real elapsed time with tens-of-milliseconds margins, so a
      # second worker competing for the core fails them for reasons unrelated to the code. They are
      # deselected above and run here alone, single-process: ~5s, which is why isolating them is
      # cheaper than the scaled-up timing budgets that would be needed to survive contention.
      - name: Tests (CPU, offline, wall-clock sensitive)
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: uv run pytest -q -m wallclock

      # The offline suite can only compare the pin against a hardcoded copy of itself, so a
      # mis-transcribed sha passes every pin test while naming a commit that was never pushed --
      # which then fails EVERY worker install at provisioning time. This is the one pin check that
      # asks the fork instead of asking the repo about itself, so it needs the network.
      #
      # Deliberately NOT covered by the offline env above: those vars are scoped to the pytest step,
      # so this step still reaches github as it must.
      - name: verl pin exists on the fork
        run: uv run python scripts/check_verl_pin_exists.py

  # `lint + offline tests` is the required status check, and the matrix above turned that one
  # check into two per-version checks. This aggregate keeps a single stable name for branch
  # protection to require, and fails if either matrix leg failed or was cancelled.
  test-result:
    name: lint + offline tests
    runs-on: ubuntu-latest
    needs: test
    if: always()
    timeout-minutes: 5
    steps:
      - name: Require every matrix leg to have succeeded
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "::error::matrix job 'test' finished with result '$RESULT'."
            exit 1
          fi
          echo "All matrix legs passed."

  typecheck:
    name: mypy (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # mypy is configured in pyproject but has never been enforced, and currently reports 411
    # errors across 95 files. This job REPORTS that debt on every PR without gating anything:
    # flip the `|| true` below into a hard failure once the count reaches zero.
    #
    # `continue-on-error` alone is not enough -- it stops the job from blocking the run, but the
    # check still renders red in the PR's check list, which is indistinguishable from a real
    # failure to a contributor. Swallowing the exit code and printing the count keeps the check
    # green while the errors stay visible in the job log and the step summary.
    #
    # Swallowing the exit code also hides the one failure that matters more than the count: a
    # syntax error makes mypy stop after the file it is in (`errors prevented further checking`),
    # so the run reports a SMALL number while checking almost nothing. That is what a stray
    # `# type:` prose comment did here -- `Found 1 error`, nothing else checked, job green. The
    # step below therefore flags an early stop explicitly, so a shrinking count can never be
    # mistaken for progress.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # pin the installed binary as well as the action implementation.
          version: "0.12.5"
          python-version: "3.11"

      - name: Sync (server extra + dev)
        run: uv sync --extra server --extra serving --dev --locked

      - name: mypy
        run: |
          # --no-color-output: mypy colorizes when it detects a tty-like sink, and the escape
          # codes break any grep over the result. Report mypy's own total line rather than
          # recounting error lines, so the summary cannot disagree with the tool.
          uv run mypy --no-color-output flash > mypy.out 2>&1 || true
          cat mypy.out
          {
            echo "### mypy (advisory)"
            echo
            echo '```'
            grep -E '^(Found|Success)' mypy.out || echo "mypy produced no summary line"
            echo '```'
            echo
            echo "This job reports type errors; it does not gate merges."
          } >> "$GITHUB_STEP_SUMMARY"
          # A run that stopped early checked almost nothing, however small its error count. Call
          # that out in the summary instead of leaving a green check that means nothing. Still
          # advisory: this warns, it does not fail the job.
          if grep -q 'errors prevented further checking' mypy.out; then
            {
              echo
              echo ":warning: **mypy stopped early and did NOT check the whole tree.**"
              echo "A syntax error aborts the run, so the count above is not the real total."
              echo "Most likely a prose comment beginning \`type:\` (see"
              echo "tests/test_type_comment_prose.py), or genuinely invalid syntax."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::mypy stopped early; the reported error count is not the real total."
          fi
