name: ci

on:
  push:
    branches: [main, dev, devV2]
  pull_request:
    branches: [main, dev, devV2]

jobs:
  test:
    name: lint + offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Sync (server extra + dev)
        run: uv sync --extra server --dev

      - name: Ruff check
        run: uv run ruff check .

      # The formatter was never gated, so 102 files had drifted out of `ruff format` shape while
      # CI stayed green. Enforcing it here keeps that from happening again; freesolo's backend job
      # runs the same two commands against the same shared config.
      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Tests (CPU, offline)
        run: uv run pytest -q
