name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

# A public repo takes a full run on every push to every fork PR branch. Without this, a
# superseded run keeps a runner for the whole suite while its replacement queues behind it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # pin the installed binary as well as the action implementation.
          version: "0.12.5"
          python-version: "3.11"

      - name: Sync (server extra + dev)
        run: uv sync --extra server --extra serving --dev --locked

      - name: Ruff check
        run: uv run ruff check .

      # The formatter was never gated, so 102 files had drifted out of `ruff format` shape while
      # CI stayed green. Enforcing it here keeps that from happening again; freesolo's backend job
      # runs the same two commands against the same shared config.
      - name: Ruff format check
        run: uv run ruff format --check .

      # Ruff has no file-length rule, so the 1000-line limit on `flash/` is enforced separately.
      - name: File size check
        run: uv run python scripts/check_file_size.py

      # The file gate alone leaves a 700-line function room to hide inside a 900-line module, so
      # the 150-line limit on functions is gated too.
      - name: Function size check
        run: uv run python scripts/check_function_size.py

      # Package roots may mix subdirectories only with semantic package marker files.
      - name: Source layout check
        run: uv run python scripts/check_source_layout.py

      # The offline suite can only compare the pin against a hardcoded copy of itself, so a
      # mis-transcribed sha passes every pin test while naming a commit that was never pushed --
      # which then fails EVERY worker install at provisioning time. This is the one pin check that
      # asks upstream instead of asking the repo about itself, so it needs the network.
      #
      # Offline environment variables are scoped to pytest steps; this check needs the network.
      - name: verl pin exists upstream
        run: uv run python scripts/check_verl_pin_exists.py

  test:
    name: offline tests (py${{ matrix.python-version }}, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        shard: [0, 1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # pin the installed binary as well as the action implementation.
          version: "0.12.5"
          python-version: ${{ matrix.python-version }}

      - name: Sync (server extra + dev)
        run: uv sync --extra server --extra serving --dev --locked

      # Keep each file whole and each shard single-process for shared module state.
      - name: Tests (CPU, offline)
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
          PYTHONPATH: .github/scripts
        run: >-
          uv run pytest -q -p ci_sharding --ci-shard ${{ matrix.shard }}
          --ci-shard-count 2 -m "not wallclock" --durations=20

      # Run timing-sensitive tests separately and exactly once per Python version.
      # Shard zero also retains the real CPU tensor regressions after dependency installation.
      - if: matrix.shard == 0
        name: Tests (CPU, offline, wall-clock sensitive)
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: uv run pytest -q -m wallclock

      # The ordinary offline environment omits torch/PEFT, so its adapter tests skip.
      # Exercise real meta tensors and frozen references with the worker's versions.
      - if: matrix.shard == 0
        name: Install CPU adapter-test dependencies
        run: |
          uv pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          uv pip install peft==0.20.0 transformers==5.12.1

      - if: matrix.shard == 0
        name: Warm-start KL reference regression (real torch and PEFT)
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          .venv/bin/python -c "import torch, peft"
          .venv/bin/pytest -q tests/test_rl_train.py -k kl_ref_adapter

      - if: matrix.shard == 0
        name: Custom training gradient and session regressions (real CPU torch)
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: .venv/bin/pytest -q tests/test_custom_gradients.py tests/test_custom_session.py tests/test_custom_client.py tests/test_custom_managed.py

  typecheck:
    name: mypy (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # mypy is configured in pyproject but has never been enforced, and currently reports 411
    # errors across 95 files. This job REPORTS that debt on every PR without gating anything:
    # flip the `|| true` below into a hard failure once the count reaches zero.
    #
    # `continue-on-error` alone is not enough -- it stops the job from blocking the run, but the
    # check still renders red in the PR's check list, which is indistinguishable from a real
    # failure to a contributor. Swallowing the exit code and printing the count keeps the check
    # green while the errors stay visible in the job log and the step summary.
    #
    # Swallowing the exit code also hides the one failure that matters more than the count: a
    # syntax error makes mypy stop after the file it is in (`errors prevented further checking`),
    # so the run reports a SMALL number while checking almost nothing. That is what a stray
    # `# type:` prose comment did here -- `Found 1 error`, nothing else checked, job green. The
    # step below therefore flags an early stop explicitly, so a shrinking count can never be
    # mistaken for progress.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # pin the installed binary as well as the action implementation.
          version: "0.12.5"
          python-version: "3.11"

      - name: Sync (server extra + dev)
        run: uv sync --extra server --extra serving --dev --locked

      - name: mypy
        run: |
          # --no-color-output: mypy colorizes when it detects a tty-like sink, and the escape
          # codes break any grep over the result. Report mypy's own total line rather than
          # recounting error lines, so the summary cannot disagree with the tool.
          uv run mypy --no-color-output flash > mypy.out 2>&1 || true
          cat mypy.out
          {
            echo "### mypy (advisory)"
            echo
            echo '```'
            grep -E '^(Found|Success)' mypy.out || echo "mypy produced no summary line"
            echo '```'
            echo
            echo "This job reports type errors; it does not gate merges."
          } >> "$GITHUB_STEP_SUMMARY"
          # A run that stopped early checked almost nothing, however small its error count. Call
          # that out in the summary instead of leaving a green check that means nothing. Still
          # advisory: this warns, it does not fail the job.
          if grep -q 'errors prevented further checking' mypy.out; then
            {
              echo
              echo ":warning: **mypy stopped early and did NOT check the whole tree.**"
              echo "A syntax error aborts the run, so the count above is not the real total."
              echo "Most likely a prose comment beginning \`type:\` (see"
              echo "tests/test_type_comment_prose.py), or genuinely invalid syntax."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::mypy stopped early; the reported error count is not the real total."
          fi

  test-result:
    name: lint + offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, test]
    if: always()
    steps:
      - name: Require every test group to have succeeded
        env:
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
        run: |
          for result in "$LINT" "$TEST"; do
            if [ "$result" != "success" ]; then
              echo "::error::required ci group finished with result '$result'."
              exit 1
            fi
          done
          echo "all required ci groups passed"
