name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: lint + offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Sync (server extra + dev)
        run: uv sync --extra server --dev

      - name: Ruff
        run: uv run ruff check .

      - name: Tests (CPU, offline)
        run: uv run pytest -q
