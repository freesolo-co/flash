name: Deploy DeepInfer pools

on:
  push:
    branches: [main, dev]
    paths:
      - flash/serving/deepinfer/**
      - flash/serving/src/**
      - flash/serve/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/deploy-deepinfer.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-deepinfer-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODAL_ENVIRONMENT: ${{ github.ref_name == 'main' && 'main' || 'dev' }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.5"
          python-version: "3.12"
      - name: Install deployment dependencies
        run: uv sync --extra serving --locked --no-dev
      - name: Deploy private DeepInfer pool
        run: uv run --no-sync modal deploy --env "$MODAL_ENVIRONMENT" -m flash.serving.deepinfer.app.modal_app
