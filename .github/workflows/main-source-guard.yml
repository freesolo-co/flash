name: Main source guard
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: main-source-guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-is-dev:
    name: Source branch is dev
    # Dependabot SECURITY updates are alert-driven, not schedule-driven, so they ignore
    # `target-branch: dev` in .github/dependabot.yml and open against the default branch (main)
    # from a `dependabot/...` head. That head can never be `dev`, so without an exemption this
    # guard fails by construction on every one of them, holding a permanently red check on the
    # exact PRs that carry CVE fixes while their `lint + offline tests` legs pass in full. The
    # rule this guard exists to enforce is that a HUMAN cannot sneak a feature branch into main;
    # a bot bump that GitHub itself targets at main is not that.
    #
    # `||`, NOT `&&`: the job must run unless BOTH bot signals hold. With `&&` the job skips when
    # EITHER holds, so a human could open a feature branch named `dependabot/x` and bypass the
    # guard outright. The PR author cannot be spoofed to `dependabot[bot]` (brackets are not legal
    # in a username, so no human account can hold that login), which is what makes requiring both
    # safe rather than a hole.
    #
    # The author must be read from `pull_request.user.login`, NOT `github.actor`. This workflow
    # declares no `types:`, so it takes the defaults opened+synchronize+reopened, and on a reopen
    # by a maintainer or a synchronize pushed by anyone other than the bot, `github.actor` is that
    # HUMAN rather than `dependabot[bot]`. Keying on the actor would then go true, run the guard,
    # and reject the `dependabot/*` head: the exact red required check this exemption exists to
    # remove, reappearing on the second event instead of the first. `pull_request.user.login` is
    # the PR opener and does not change with whoever triggered the event.
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]'
      || !startsWith(github.head_ref, 'dependabot/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require PRs into main to originate from this repo's dev branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          UPSTREAM_REPO: ${{ github.repository }}
        run: |
          # provenance is checked BEFORE the branch name, because the name alone proves nothing.
          # `github.head_ref` is the branch name inside the HEAD repository, which for a fork PR is
          # whatever the fork owner called it, so a name-only check goes green for anyone who
          # forks this repo, names a branch `dev`, and opens a PR straight into main. under the
          # documented dev -> main promotion model a cross-repo head is never legitimate, so it is
          # rejected outright rather than compared by name.
          #
          # an unset HEAD_REPO (deleted fork, non-pull_request event) is an empty string here and
          # therefore fails closed.
          if [ "$HEAD_REPO" != "$UPSTREAM_REPO" ]; then
            echo "::error::fork source not allowed for main: this PR's head repository is '$HEAD_REPO', not '$UPSTREAM_REPO'. Open contributions against dev; only a dev -> main promotion inside '$UPSTREAM_REPO' may target main."
            exit 1
          fi
          if [ "$HEAD_REF" != "dev" ]; then
            echo "::error::wrong source branch: PRs into main must come from 'dev' (got '$HEAD_REF'). Merge into dev, then promote dev -> main."
            exit 1
          fi
          echo "Source '$HEAD_REPO' branch '$HEAD_REF' is allowed."
