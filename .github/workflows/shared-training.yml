name: shared training

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: shared-training-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tensors:
    name: shared trainer real tensors (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.5"
          python-version: ${{ matrix.python-version }}
      - name: Install offline test dependencies
        run: uv sync --extra server --extra serving --dev --locked
      - name: Install real CPU tensors and adapters
        run: |
          uv pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          uv pip install peft==0.19.0
      - name: Require tensor dependencies and run shared training tests
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
        # Direct venv invocation preserves the explicitly installed CPU wheel; import
        # first so an absent dependency cannot turn qualification into skipped tests.
        run: |
          .venv/bin/python -c 'import torch, peft'
          .venv/bin/pytest tests/test_shared_training*.py
