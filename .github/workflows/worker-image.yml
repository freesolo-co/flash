name: flash worker image

# builds the prebuilt flash worker image (full training stack + flash-attn baked in) and
# pushes it to ghcr, so runpod/vast/lambda training cold-start skips the per-host dependency
# install (the dominant cold-start cost). training providers select the pinned image through
# flash/providers/_lifecycle/net/worker.py; there is no override, so a new build means bumping the
# WORKER_IMAGE constant. serving has no consumer for this training-worker image.
#
# Triggered automatically on flash/** changes (worker training code is baked in; skipping a
# rebuild leaves GPU workers running stale code) and manually for Dockerfile/dep changes.
# The build is heavy (vllm + full training stack + flash-attn wheel) but Docker layer caching
# means only the flash COPY+install layer reruns on pure Python changes (~minutes, not hours).

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      source_ref:
        type: string
        required: true
    outputs:
      base_ref:
        description: digest-pinned worker base
        value: ${{ jobs.build.outputs.base_ref }}
      fp_cache:
        description: kernel-cache compatibility fingerprint
        value: ${{ jobs.build.outputs.fp_cache }}
      fp_base:
        description: full worker-base fingerprint
        value: ${{ jobs.build.outputs.fp_base }}
      base_revision:
        description: resolved source revision
        value: ${{ jobs.build.outputs.base_revision }}
  workflow_dispatch:
    inputs:
      tag:
        description: image tag
        default: cu128
        required: false
  push:
    branches: [main]
    paths:
      - Dockerfile.worker
      - .github/workflows/worker-image.yml
      - flash/**
      - pyproject.toml
      # The baked rp_handler is generated from _train_body at build time (docker/make_rp_handler.py),
      # so handler changes (e.g. the weight-cache preload branch) MUST rebuild the image. flash/**
      # covers the handler source (endpoints.py); the generator lives outside flash/, so watch it too.
      - docker/make_rp_handler.py
      # The fp_cache/fp_base labels are computed by this script at build time, so a change to the
      # fingerprint logic must rebuild :cu128 to re-stamp them (else auto-rebake never reclassifies).
      - docker/kernel_fingerprint.py
      # The tilelang libcudart repair baked into /opt/verl-venv is generated by this extractor at
      # build time. flash/** covers the _CHILD_CUDART_FIX source it reads; the extractor itself sits
      # outside flash/, so a change to it alone would ship an image still carrying the old repair.
      - docker/extract_cudart_fix.py

permissions:
  contents: read
  packages: write

# A newer base build supersedes an older one: cancel the in-flight run so auto-rebake (which triggers
# on this workflow's completion) only ever reasons about the latest :cu128. The tag is in the group so
# a non-prod `tag=cu128-test` dispatch can't cancel an in-flight prod `cu128` push on the same ref
# (which would leave :cu128 unpublished for that commit and auto-rebake blind to it).
concurrency:
  group: worker-image-${{ github.ref }}-${{ inputs.tag || github.event.inputs.tag || 'cu128' }}
  cancel-in-progress: true

jobs:
  build:
    # Upstream only -- see publish.yml. Two reasons beyond the shared one: it pushes to
    # `ghcr.io/freesolo-co/flash-worker` (our namespace, unwritable by a fork's token), and it asks
    # for `ubuntu-24.04-8core`, an org-provisioned larger runner. A fork requesting a label it has
    # no runner for leaves the job QUEUED indefinitely rather than failing, which is worse than a
    # red X: nothing reports, and the PR just never settles.
    if: github.repository == 'freesolo-co/flash'
    runs-on: ubuntu-24.04-8core
    # ~26min is the slowest run on record (40 runs; the median is 15min, and a warm layer cache
    # keeps a pure-Python change near the low end). 90 leaves room for a cold cache rebuilding
    # vllm and the flash-attn wheels from scratch, while still releasing the runner well before
    # the 6-hour default would.
    timeout-minutes: 90
    outputs:
      base_ref: ghcr.io/freesolo-co/flash-worker@${{ steps.image.outputs.digest }}
      fp_cache: ${{ steps.fp.outputs.fp_cache }}
      fp_base: ${{ steps.fp.outputs.fp_base }}
      base_revision: ${{ steps.source.outputs.revision }}
    # Single source for the FlashAttention wheel: used BOTH as a build-arg and as a fingerprint input
    # (so a wheel bump moves fp_base). Keep FA2_SPEC in sync with Dockerfile.worker's ARG default.
    env:
      FA2_SPEC: https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.9.0/flash_attn-2.8.3%2Bcu128torch2.10-cp312-cp312-linux_x86_64.whl
      # The wheel is verified against this before install (Dockerfile.worker does the sha256sum
      # -c). Keep it in sync with Dockerfile.worker's ARG default, exactly like the spec. Also
      # a fingerprint input, same as the spec above: a maintainer who rotates a digest after a
      # release asset was replaced (same url, new sha256) must move fp_base, or auto-rebake would
      # call every per-arch tag up to date on a base that no longer matches what got baked.
      FA2_SHA256: a58c95a080363606e691c342d47dd173b510f4c013a8c5fcb8744def12e36a0f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Resolve source metadata
        id: source
        env:
          IMAGE_TAG: ${{ inputs.tag || github.event.inputs.tag || 'cu128' }}
        run: |
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      # Compute the kernel-cache fingerprints (stdlib-only, no uv sync) and stamp them as labels on
      # :cu128 below, so auto-rebake.yml can read what this base was built from. Fails the build if a
      # pin can't be parsed -- a silent miss would let a stale per-arch cache ship as a cold-JIT.
      - name: Compute kernel fingerprints
        id: fp
        run: python3 docker/kernel_fingerprint.py --format github --fa2-spec "$FA2_SPEC" --fa2-sha256 "$FA2_SHA256" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /opt/hostedtoolcache /usr/share/swift \
            /usr/local/share/boost /usr/local/lib/node_modules \
            /usr/local/share/powershell /usr/share/miniconda || true
          sudo apt-get clean || true
          sudo docker image prune -af || true
          df -h /

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push worker image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.worker
          push: true
          # pin the freesolo-co namespace: runpod, vast, and lambda training paths pull the image
          # declared in flash/providers/_lifecycle/net/worker.py, so a fork run must not push to its own owner
          # namespace and leave the real image stale.
          tags: ghcr.io/freesolo-co/flash-worker:${{ steps.source.outputs.tag }}
          provenance: false
          # Stamp the kernel-cache fingerprints + the source commit so auto-rebake.yml can read what
          # this base was built from (docker/kernel_fingerprint.py is the source of truth).
          labels: |
            co.freesolo.flash.kernelcache.fp_cache=${{ steps.fp.outputs.fp_cache }}
            co.freesolo.flash.kernelcache.fp_base=${{ steps.fp.outputs.fp_base }}
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
          # Install a PREBUILT flash-attn wheel instead of compiling from source (a multi-arch
          # source compile is huge and OOM-kills the runner). The wheel matches the base exactly
          # (cu128 / torch2.10 / cp312). The FA2 spec comes from the job-level env (single source).
          build-args: |
            FLASH_ATTN_SPEC=${{ env.FA2_SPEC }}
            FLASH_ATTN_SHA256=${{ env.FA2_SHA256 }}

      # When :cu128 is republished the per-arch cu128-sm* tags go stale. auto-rebake.yml now handles
      # that automatically on this workflow's completion: a free re-layer when only the base moved, or
      # a one-click GPU re-warm when the kernel toolchain changed (it reads the fp_cache/fp_base labels
      # stamped above vs each published per-arch tag). The old manual reminder is gone.
