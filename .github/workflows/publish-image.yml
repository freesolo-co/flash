name: Publish flash image

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "flash/**"
      - "Dockerfile"
      - "pyproject.toml"
      - "scripts/build_dev_dist.py"
      - ".github/workflows/publish-image.yml"
  workflow_dispatch:

concurrency:
  group: publish-flash-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-flash-image:
    name: Build and push flash control-plane image
    # Upstream only -- see publish.yml. The push target `ghcr.io/freesolo-co/freesolo-flash` is in
    # our org namespace, so a fork's GITHUB_TOKEN cannot write it: the build would burn ~10 minutes
    # and then fail at the push. A fork that wants its own image builds it from the Dockerfile.
    if: github.repository == 'freesolo-co/flash'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/freesolo-co/freesolo-flash

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          # main publishes :main + :latest; any other branch (dev) publishes
          # :<branch>. every build also gets an immutable :sha-<short> tag.
          short_sha="$(git rev-parse --short HEAD)"
          branch="${GITHUB_REF_NAME}"
          {
            echo "tags<<EOF"
            if [ "$branch" = "main" ]; then
              echo "${IMAGE}:main"
              echo "${IMAGE}:latest"
            else
              echo "${IMAGE}:${branch}"
            fi
            echo "${IMAGE}:sha-${short_sha}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # The checked-in source always ships CHANNEL="prod" (scripts/_channel.py) -- the PyPI
      # dev-channel package (publish-dev.yml) already flips it via the same script before its
      # own build. The Docker image build never did, so `:dev` shipped with CHANNEL="prod" and
      # every channel-derived default (serving URL, control-plane URL, CLI/dist names) resolved
      # to prod instead of dev. Apply the same full transform here, dev branch only -- :main must
      # ship as checked in. --no-build applies the pyproject + channel rewrites together (they
      # must move in lockstep: flash/__init__.py's __version__ resolves via
      # importlib.metadata.version(DIST_NAME), so flipping CHANNEL alone leaves that lookup
      # pointed at a distribution name nothing installed) and skips `uv build`, which this image
      # doesn't need.
      - name: Set up Python
        if: github.ref_name == 'dev'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Apply dev-channel source transform for the dev image
        if: github.ref_name == 'dev'
        run: python3 scripts/build_dev_dist.py --no-build

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
