name: dev kernel-cache candidate

# dev pushes only run the metadata detector. the scheduled or manual run builds the newest
# missing candidate, so several daytime changes coalesce into one off-peak gpu bake.
# a dev -> main promotion builds missing candidates immediately and retries its readiness gate.

on:
  push:
    branches: [dev]
    paths:
      - Dockerfile.worker
      - .github/workflows/worker-image.yml
      - .github/workflows/bake-kernel-cache.yml
      - .github/workflows/dev-kernel-cache.yml
      - docker/**
      - flash/**
      - pyproject.toml
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    # 09:00 utc is 01:00 pst / 02:00 pdt.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      deadline_minutes:
        description: "Maximum GPU runtime per architecture (1–90 minutes)"
        type: number
        default: 90
        required: false

permissions:
  actions: write
  contents: read
  packages: write

concurrency:
  # a metadata-only push must not replace a queued promotion bake in the pending slot.
  group: dev-kernel-cache-${{ github.event_name == 'push' && 'detect' || 'build' }}
  cancel-in-progress: false

jobs:
  dispatch-dev:
    if: github.repository == 'freesolo-co/flash' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Dispatch the dev workflow definition
        run: gh workflow run dev-kernel-cache.yml --repo "$GITHUB_REPOSITORY" --ref dev

  detect:
    if: >-
      github.repository == 'freesolo-co/flash' && github.event_name != 'schedule' &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref == 'dev' && !github.event.pull_request.draft))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      needs_bake: ${{ steps.classify.outputs.needs_bake }}
      revision: ${{ steps.source.outputs.revision }}
      fp_cache: ${{ steps.fp.outputs.fp_cache }}
      fp_base: ${{ steps.fp.outputs.fp_base }}
      sms: ${{ steps.source.outputs.sms }}
    env:
      FA2_SPEC: https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.9.0/flash_attn-2.8.3%2Bcu128torch2.10-cp312-cp312-linux_x86_64.whl
      FA2_SHA256: a58c95a080363606e691c342d47dd173b510f4c013a8c5fcb8744def12e36a0f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Resolve source metadata
        id: source
        run: |
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          arches=$(python3 docker/kernel_fingerprint.py --print-baked-arches)
          echo "sms=$(echo "$arches" | tr ' ' ',')" >> "$GITHUB_OUTPUT"

      - name: Compute kernel fingerprints
        id: fp
        run: python3 docker/kernel_fingerprint.py --format github --fa2-spec "$FA2_SPEC" --fa2-sha256 "$FA2_SHA256" >> "$GITHUB_OUTPUT"

      - name: Install crane
        run: |
          set -euo pipefail
          ver=v0.20.2
          sha=c14340087103ba9dadf61d45acd20675490fd0ccbd56ac7901fc1b502137f44b
          curl -fsSL -o /tmp/crane.tar.gz \
            "https://github.com/google/go-containerregistry/releases/download/${ver}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${sha}  /tmp/crane.tar.gz" | sha256sum -c -
          sudo tar -xz -C /usr/local/bin -f /tmp/crane.tar.gz crane
          rm -f /tmp/crane.tar.gz
          crane version

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check published caches
        id: classify
        env:
          FP_CACHE: ${{ steps.fp.outputs.fp_cache }}
          REVISION: ${{ steps.source.outputs.revision }}
        run: |
          set -euo pipefail
          arches=$(python3 docker/kernel_fingerprint.py --print-baked-arches)
          uncovered=false
          summary="| arch | production | dev candidate |\n|---|---|---|\n"
          for sm in $arches; do
            prod="ghcr.io/freesolo-co/flash-worker:cu128-$sm"
            candidate="ghcr.io/freesolo-co/flash-worker:cu128-dev-ready-$sm"

            prod_pc=""
            if cfg=$(crane config "$prod" 2>/dev/null); then
              prod_pc=$(echo "$cfg" | jq -r '.config.Labels["co.freesolo.flash.kernelcache.fp_cache"] // ""')
            fi
            candidate_pc=""; candidate_rev=""
            if cfg=$(crane config "$candidate" 2>/dev/null); then
              candidate_pc=$(echo "$cfg" | jq -r '.config.Labels["co.freesolo.flash.kernelcache.fp_cache"] // ""')
              candidate_rev=$(echo "$cfg" | jq -r '.config.Labels["org.opencontainers.image.revision"] // ""')
            fi
            if [ "$prod_pc" != "$FP_CACHE" ] && [ "$candidate_pc" != "$FP_CACHE" ]; then
              uncovered=true
            fi

            summary="$summary| $sm | \`${prod_pc:-missing}\` | \`${candidate_pc:-missing}\` at \`${candidate_rev:-unknown}\` |\n"
          done

          if [ "$uncovered" = true ]; then
            echo "needs_bake=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_bake=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "### dev kernel-cache candidate"
            echo ""
            echo "source revision: \`$REVISION\`"
            echo ""
            echo -e "$summary"
            if [ "${{ github.event_name }}" = push ] && [ "$uncovered" = true ]; then
              echo "A bake is pending for the next off-peak run. Use workflow dispatch for an urgent release."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build-base:
    needs: detect
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') && needs.detect.outputs.needs_bake == 'true'
    uses: ./.github/workflows/worker-image.yml
    with:
      tag: cu128-dev-${{ needs.detect.outputs.revision }}
      source_ref: ${{ needs.detect.outputs.revision }}
    secrets: inherit

  bake:
    needs: [detect, build-base]
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') && needs.detect.outputs.needs_bake == 'true'
    uses: ./.github/workflows/bake-kernel-cache.yml
    with:
      sms: ${{ needs.detect.outputs.sms }}
      deadline_minutes: ${{ fromJSON(github.event_name == 'pull_request' && '90' || format('{0}', inputs.deadline_minutes)) }}
      fp_cache: ${{ needs.build-base.outputs.fp_cache }}
      fp_base: ${{ needs.build-base.outputs.fp_base }}
      base_ref: ${{ needs.build-base.outputs.base_ref }}
      base_revision: ${{ needs.build-base.outputs.base_revision }}
      target_tag_prefix: cu128-dev-${{ needs.detect.outputs.revision }}
    secrets: inherit

  publish-ready:
    needs: [detect, bake]
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') && needs.detect.outputs.needs_bake == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install crane
        run: |
          set -euo pipefail
          ver=v0.20.2
          sha=c14340087103ba9dadf61d45acd20675490fd0ccbd56ac7901fc1b502137f44b
          curl -fsSL -o /tmp/crane.tar.gz \
            "https://github.com/google/go-containerregistry/releases/download/${ver}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${sha}  /tmp/crane.tar.gz" | sha256sum -c -
          sudo tar -xz -C /usr/local/bin -f /tmp/crane.tar.gz crane
          rm -f /tmp/crane.tar.gz
          crane version

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish ready aliases
        env:
          FP_CACHE: ${{ needs.detect.outputs.fp_cache }}
          REVISION: ${{ needs.detect.outputs.revision }}
          SMS: ${{ needs.detect.outputs.sms }}
        run: |
          set -euo pipefail
          repo=ghcr.io/freesolo-co/flash-worker
          for sm in ${SMS//,/ }; do
            source="$repo:cu128-dev-$REVISION-$sm"
            cfg=$(crane config "$source")
            pc=$(echo "$cfg" | jq -r '.config.Labels["co.freesolo.flash.kernelcache.fp_cache"] // ""')
            rev=$(echo "$cfg" | jq -r '.config.Labels["org.opencontainers.image.revision"] // ""')
            if [ "$pc" != "$FP_CACHE" ] || [ "$rev" != "$REVISION" ]; then
              echo "candidate validation failed for $sm: fp_cache=$pc revision=$rev" >&2
              exit 1
            fi
          done
          for sm in ${SMS//,/ }; do
            crane copy \
              "$repo:cu128-dev-$REVISION-$sm" \
              "$repo:cu128-dev-ready-$sm"
          done

      - name: Re-run failed production readiness for this revision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVISION: ${{ needs.detect.outputs.revision }}
        run: |
          set -euo pipefail
          runs=$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow production-kernel-cache-ready.yml --commit "$REVISION" \
            --event pull_request --status failure --json databaseId --jq '.[].databaseId')
          for run_id in $runs; do
            gh run rerun "$run_id" --repo "$GITHUB_REPOSITORY" --failed
          done
