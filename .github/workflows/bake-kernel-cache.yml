name: flash worker kernel-cache (per-arch)

# Builds per-SM worker images with compiled kernel caches baked in to reuse matching kernels
# on cold workers. Each matrix leg:
#   1. offloads the warmup to a Modal GPU of that arch (GH runners have none) -> build/kernel_cache,
#   2. builds docker/Dockerfile.kernelcache -> ghcr.io/freesolo-co/flash-worker:cu128-<sm>,
#   3. pushes it. The allocator then selects the cu128-<sm> tag per GPU class for baked arches
#      (see flash/providers/_lifecycle/net/worker.py).
#
# Depends on the base ghcr.io/freesolo-co/flash-worker:cu128 image existing (worker-image.yml) — the
# warmup runs INSIDE it so the cache matches the image's pinned torch/triton/fla/liger toolchain.
#
# Secrets: MODAL_TOKEN_ID + MODAL_TOKEN_SECRET (the warmup GPU sandbox) + HF_TOKEN (the temp dataset that ferries code + the
# cache artifact) are native repo Actions secrets, synced from Infisical (prod:/flash-ci) by the
# github-ci-flash Secret Sync; the GHCR push uses the default GITHUB_TOKEN. Heavy + paid,
# but UNGATED: the fingerprint detection in auto-rebake.yml decides WHEN this runs (only on a real
# kernel-toolchain change), so there is no manual approval step. Invoked by hand (workflow_dispatch)
# OR automatically by auto-rebake.yml (workflow_call) when the kernel toolchain changed.

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Existing worker base image to bake (labels pin its source and fingerprints)"
        type: string
        default: "ghcr.io/freesolo-co/flash-worker:cu128"
        required: false
      sms:
        description: "comma-separated sm list to bake; default is all validated arches"
        default: "sm80,sm86,sm89,sm90,sm120,sm100"
        required: false
      deadline_minutes:
        description: "Maximum GPU runtime per architecture (1–90 minutes)"
        type: number
        default: 90
        required: false
      target_tag_prefix:
        description: "target image tag before the -sm suffix"
        default: "cu128"
        required: false
  # auto-rebake.yml calls this for the EXPENSIVE path (the cache is invalid and must be re-warmed on a
  # real GPU). It passes the arch subset, the fingerprints to stamp, and a digest-pinned base so the
  # warm runs inside the exact :cu128 the per-arch tag will sit on.
  workflow_call:
    inputs:
      deadline_minutes:
        type: number
        default: 90
        required: false
      sms:
        type: string
        required: true
      fp_cache:
        type: string
        required: false
        default: ""
      fp_base:
        type: string
        required: false
        default: ""
      base_ref:
        type: string
        required: false
        default: "ghcr.io/freesolo-co/flash-worker:cu128"
      base_revision:
        type: string
        required: false
        default: ""
      target_tag_prefix:
        type: string
        required: false
        default: "cu128"

permissions:
  contents: read
  packages: write

jobs:
  # Ungated: the PAID Modal bake runs as soon as it's called/dispatched. The decision of WHEN to run
  # lives in auto-rebake.yml's fingerprint gate (it only invokes this when fp_cache changed), so a
  # second manual approval here would be redundant. Re-add an `approve` job with `environment: gpu-bake`
  # (and `needs: approve`) if you ever want a human checkpoint back.
  bake:
    # Upstream only -- see publish.yml. "Ungated" above means no human APPROVAL step; it never meant
    # any repository may start it. This workflow is directly dispatchable (`workflow_dispatch`), so
    # a fork reaches it without passing auto-rebake's fingerprint gate, and it both requests the
    # org-only `ubuntu-24.04-8core` runner (a label a fork has no runner for, so the job QUEUES
    # instead of failing) and creates paid Modal resources. `workflow_call` from auto-rebake still
    # satisfies this, because a called workflow evaluates `github.repository` as the CALLER's repo.
    if: github.repository == 'freesolo-co/flash'
    runs-on: ubuntu-24.04-8core
    # 47min is the slowest run on record (the rest sit at 12-23min); 120 absorbs a slow provider
    # allocation without letting a hung bake hold the runner for the 6-hour default.
    #
    # Modal also enforces the sandbox lifetime when the CI controller disappears.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              sm: sm80,
              arch: "8.0",
            }
          - {
              sm: sm86,
              arch: "8.6",
            }
          # the controller walks ordered same-sm secure-cloud gpu types from its per-sm map.
          # preferred datacenter cards stay first, but one empty sku cannot strand this architecture
          # on a stale image and send ordinary starts through jit.
          - {
              sm: sm89,
              arch: "8.9",
            }
          - {
              sm: sm90,
              arch: "9.0",
            }
          # blackwell needs cuda-13 hosts to jit its ptx (matches min_cuda_for in the provider).
          - {
              sm: sm120,
              arch: "12.0",
            }
          # datacenter blackwell is distinct from sm120. b200 is the only validated sm100 type.
          - {
              sm: sm100,
              arch: "10.0",
            }
    steps:
      # Gate FIRST (no checkout needed) so skipped arches do no crane / checkout / build work.
      - name: Should bake ${{ matrix.sm }}?
        id: gate
        env:
          REQUESTED_SMS: ${{ inputs.sms || 'sm80,sm86,sm89,sm90,sm120,sm100' }}
          BAKE_DEADLINE_MINUTES: ${{ inputs.deadline_minutes }}
        run: |
          # Leave 30 minutes of the 120-minute job for setup, transfer and publication.
          if ! [[ "$BAKE_DEADLINE_MINUTES" =~ ^([1-9]|[1-8][0-9]|90)$ ]]; then
            echo "::error::deadline_minutes must be an integer from 1 to 90"
            exit 1
          fi
          req="$REQUESTED_SMS"
          req="${req// /}"   # tolerate spaces, e.g. "sm80, sm86"
          case ",$req," in
            *,${{ matrix.sm }},*) echo "run=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "run=false" >> "$GITHUB_OUTPUT"; echo "skipping ${{ matrix.sm }}" ;;
          esac

      # Downloaded to disk and checksum-verified before extraction, rather than piped straight
      # into tar: a piped stream is extracted as it arrives, so a corrupted or substituted
      # artifact is already on PATH by the time anything could notice. Bump the version and the
      # digest together (the vendor publishes checksums.txt alongside each release).
      - name: Install crane
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          ver=v0.20.2
          sha=c14340087103ba9dadf61d45acd20675490fd0ccbd56ac7901fc1b502137f44b
          curl -fsSL -o /tmp/crane.tar.gz \
            "https://github.com/google/go-containerregistry/releases/download/${ver}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${sha}  /tmp/crane.tar.gz" | sha256sum -c -
          sudo tar -xz -C /usr/local/bin -f /tmp/crane.tar.gz crane
          rm -f /tmp/crane.tar.gz
          crane version

      - name: Log in to GHCR
        if: steps.gate.outputs.run == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Resolve the base + fingerprints BEFORE checkout, so the checkout (hence the warmed flash code)
      # is pinned to the EXACT commit the base was built from. auto-rebake passes everything (fast path);
      # a manual dispatch READS the labels off the published base, so the per-arch image always matches
      # the base it extends (same source of truth as the gate) instead of recomputing from the checkout.
      - name: Resolve base + fingerprints
        id: base
        if: steps.gate.outputs.run == 'true'
        env:
          BASE_REF: ${{ inputs.base_ref || 'ghcr.io/freesolo-co/flash-worker:cu128' }}
          FP_CACHE: ${{ inputs.fp_cache }}
          FP_BASE: ${{ inputs.fp_base }}
          BASE_REVISION: ${{ inputs.base_revision }}
        run: |
          if [ -n "$FP_CACHE" ]; then
            echo "ref=$BASE_REF" >> "$GITHUB_OUTPUT"
            echo "fp_cache=$FP_CACHE" >> "$GITHUB_OUTPUT"
            echo "fp_base=$FP_BASE" >> "$GITHUB_OUTPUT"
            echo "revision=$BASE_REVISION" >> "$GITHUB_OUTPUT"
          else
            ref=$(crane digest --full-ref "$BASE_REF")
            cfg=$(crane config "$ref")
            echo "ref=$ref" >> "$GITHUB_OUTPUT"
            echo "fp_cache=$(echo "$cfg" | jq -r '.config.Labels["co.freesolo.flash.kernelcache.fp_cache"] // ""')" >> "$GITHUB_OUTPUT"
            echo "fp_base=$(echo "$cfg" | jq -r '.config.Labels["co.freesolo.flash.kernelcache.fp_base"] // ""')" >> "$GITHUB_OUTPUT"
            echo "revision=$(echo "$cfg" | jq -r '.config.Labels["org.opencontainers.image.revision"] // ""')" >> "$GITHUB_OUTPUT"
          fi

      # Pin the checkout to the base's source commit so the warmed flash code matches the base exactly
      # (the cache is content-keyed by the code that compiled it). Falls back to the event sha if the
      # base predates the revision label.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.run == 'true'
        with:
          ref: ${{ steps.base.outputs.revision || github.sha }}

      - name: Install uv
        if: steps.gate.outputs.run == 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # pin the installed binary as well as the action implementation.
          version: "0.12.5"
          # no cache: the post-run cache-prune calls `uv`, but the "Free disk space" step deletes
          # /opt/hostedtoolcache (where setup-uv put uv), so the post step fails ("uv not found") and
          # marks the whole job red even though the bake + push already succeeded.
          enable-cache: false

      - name: Sync deps (flash + modal + hf)
        if: steps.gate.outputs.run == 'true'
        run: uv sync --extra server

      # MODAL_TOKEN_ID + MODAL_TOKEN_SECRET (the warmup GPU sandbox) + HF_TOKEN (the temp dataset that ferries code/cache) are
      # native repo Actions secrets, synced from Infisical (prod:/flash-ci) by the github-ci-flash
      # Secret Sync. No Infisical CLI/login at job time -- Infisical stays the source of truth and
      # rotations propagate via the sync. BASE_IMAGE
      # is digest-pinned so the warm runs inside the EXACT base the per-arch tag will sit on.
      - name: Warm kernels on a Modal ${{ matrix.sm }} GPU -> build/kernel_cache
        if: steps.gate.outputs.run == 'true'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          BASE_IMAGE: ${{ steps.base.outputs.ref }}
          BAKE_DEADLINE_MINUTES: ${{ inputs.deadline_minutes }}
        run: |
          uv run python docker/bake_kernel_cache.py \
            --arch "${{ matrix.arch }}" --sm "${{ matrix.sm }}" \
            --image "$BASE_IMAGE" \
            --deadline-min "$BAKE_DEADLINE_MINUTES" \
            --out build/kernel_cache

      - name: Free disk space
        if: steps.gate.outputs.run == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /opt/hostedtoolcache /usr/share/swift \
            /usr/local/share/boost /usr/local/lib/node_modules \
            /usr/local/share/powershell /usr/share/miniconda || true
          sudo apt-get clean || true
          sudo docker image prune -af || true
          df -h /

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.gate.outputs.run == 'true'

      # thin layer FROM the SAME base the warmup ran inside -> the cache toolchain always matches the
      # shipped image (rebuilding the full Dockerfile.worker from the checkout could drift from the
      # published base and bake a cache that silently won't load). GHCR auth from the login step above.
      - name: Build + push baked per-sm image (thin layer on the warmed base)
        if: steps.gate.outputs.run == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.kernelcache
          push: true
          tags: ghcr.io/freesolo-co/flash-worker:${{ inputs.target_tag_prefix || 'cu128' }}-${{ matrix.sm }}
          provenance: false
          build-args: |
            BASE=${{ steps.base.outputs.ref }}
            FP_CACHE=${{ steps.base.outputs.fp_cache }}
            FP_BASE=${{ steps.base.outputs.fp_base }}
            BASE_REVISION=${{ steps.base.outputs.revision }}
