name: Publish flash dev-channel package

# Auto-publish the dev-channel package `freesolo-flash-dev` (the `flash-dev` CLI, which defaults
# to the staging plane flash-dev.freesolo.co) to PyPI from the `dev` branch.
#
# Trigger: a push to `dev` that touches package files. We publish iff the dev-channel version
# ([tool.flash-dev].version in pyproject.toml) is NOT already on PyPI. So bumping that version and
# merging to `dev` cuts a release; ordinary dev pushes (version unchanged -> already published)
# no-op. This mirrors freesolo-flash's publish.yml, but keyed on the dev version and on `dev`
# instead of `main`, and a no-op is a clean success (not a failure) since most dev pushes don't
# bump it. Manual runs via workflow_dispatch re-run the same version check for the current dev
# version (still a no-op when it's already on PyPI — not a forced re-publish).
on:
  push:
    branches:
      - dev
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "flash/**"
      - "scripts/build_dev_dist.py"
      - ".github/workflows/publish-dev.yml"
  workflow_dispatch:

concurrency:
  group: publish-flash-dev-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-pypi-dev:
    name: Publish freesolo-flash-dev to PyPI
    # Upstream only -- see publish.yml. This one matters more for a fork: it fires on every push to
    # `dev`, which is the branch a contributor actually works on, so without the guard a fork sees a
    # failing run on ordinary development.
    if: github.repository == 'freesolo-co/flash'
    runs-on: ubuntu-latest
    # See publish.yml: same shape, same reason for the generous cap -- a timeout between the upload
    # and the tag push leaves a shipped version whose commit is unrecorded.
    timeout-minutes: 30
    permissions:
      # `write` (not `read`) because the tag step at the end of this job pushes a git tag.
      contents: write
    env:
      UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # tomllib is stdlib only since 3.11; pin the interpreter before the metadata step below.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Read dev-channel version (and enforce parity with the prod version)
        id: meta
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import sys
          import tomllib

          with open("pyproject.toml", "rb") as f:
              data = tomllib.load(f)
          dev_version = data["tool"]["flash-dev"]["version"]
          prod_version = data["project"]["version"]
          # The two channels MUST ship in lockstep (version-parity.yml enforces this on PRs). Re-check
          # it here so the PUBLISH path can never ship a dev wheel out of sync with freesolo-flash even
          # if the parity CI was bypassed or branch protection isn't strict — fail before build/publish.
          if dev_version != prod_version:
              print(
                  f"::error::version mismatch: [tool.flash-dev].version={dev_version} != "
                  f"[project].version={prod_version}; bump both in lockstep before publishing.",
                  file=sys.stderr,
              )
              sys.exit(1)
          print(f"version={dev_version}")
          PY

      - name: Decide whether to publish
        id: decide
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import urllib.error
          import urllib.request

          version = os.environ["VERSION"]
          url = f"https://pypi.org/pypi/freesolo-flash-dev/{version}/json"
          published = False
          try:
              with urllib.request.urlopen(url, timeout=30) as response:
                  published = response.status == 200
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          # Publish only when the dev version isn't on PyPI yet (i.e. it was just bumped).
          print(f"publish={'false' if published else 'true'}")
          PY

      - name: Already published (nothing to do)
        if: steps.decide.outputs.publish == 'false'
        run: echo "freesolo-flash-dev ${{ steps.meta.outputs.version }} is already on PyPI; nothing to publish."

      # See publish.yml: checked before the irreversible upload, not after it.
      - name: Fail if the dev tag exists on another commit
        if: steps.decide.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          tag="dev-v${VERSION}"
          # No `|| true`: `git ls-remote` exits 0 for BOTH "tag present" and "tag absent", and
          # non-zero only when the lookup itself failed (unreachable remote, auth). Swallowing that
          # would turn a network blip into "no tag exists" and wave the release through unvalidated,
          # so a failed lookup must fail the step.
          # `rc` is captured on the same line: inside `if ! ...`, a later `$?` reports the negation's
          # result (always 0), not git's.
          existing="$(git ls-remote --tags origin "refs/tags/${tag}" "refs/tags/${tag}^{}")" && rc=0 || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::Could not query tags on origin (git ls-remote exit ${rc}). Refusing to continue: a failed lookup is not proof that ${tag} is free."
            exit 1
          fi
          if [ -n "$existing" ]; then
            peeled="$(printf '%s\n' "$existing" | awk '$2 ~ /\^\{\}$/ {print $1; exit}')"
            plain="$(printf '%s\n' "$existing" | awk '$2 !~ /\^\{\}$/ {print $1; exit}')"
            target="${peeled:-$plain}"
            if [ "$target" != "$GITHUB_SHA" ]; then
              echo "::error::Tag ${tag} already exists on origin but points at ${target}, not this commit (${GITHUB_SHA}). Refusing to publish ${VERSION}: the dev tag is the only record of which commit shipped in a version, and this one would be false. Resolve the tag by hand."
              exit 1
            fi
          fi

      - name: Install uv
        if: steps.decide.outputs.publish == 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # pin the installed binary as well as the action implementation.
          version: "0.12.5"
          python-version: "3.11"

      - name: Build dev-channel distribution
        if: steps.decide.outputs.publish == 'true'
        run: |
          rm -rf dist
          # build_dev_dist.py renames the package to freesolo-flash-dev, retargets the CLI to
          # flash-dev, flips the channel to the staging plane, then runs `uv build`.
          python3 scripts/build_dev_dist.py

      - name: Publish to PyPI
        if: steps.decide.outputs.publish == 'true'
        run: |
          if [ -z "$UV_PUBLISH_TOKEN" ]; then
            echo "::error::UV_PUBLISH_TOKEN is empty (sourced from the PYPI_API_TOKEN repo secret); refusing to publish without credentials. Set the PYPI_API_TOKEN secret on this repository."
            exit 1
          fi
          uv publish

      # Tag only -- no GitHub release. The dev channel ships several times a day, so a release per
      # version would bury the prod releases it is meant to sit alongside. The tag is the part that
      # carries the information: it is the only record of WHICH commit is inside a given
      # `freesolo-flash-dev` version. Without it, two commits claiming the same version (which is a
      # thing that happens here -- concurrent PRs bump to the same number, merge without conflict,
      # and the second silently no-publishes) are indistinguishable after the fact.
      #
      # Named `dev-v<version>` so the dev channel shares no namespace with prod's `v<version>`:
      # both channels use the SAME version number by design (version-parity.yml enforces it), so a
      # shared prefix would collide on every single release.
      #
      # KNOWN LIMITATION -- same non-self-healing shape as publish.yml. If PyPI accepts the upload
      # and the tag push then fails, re-running does NOT repair it: `Decide whether to publish`
      # finds the version already on the index and sets publish=false, so this step is skipped
      # from then on. Repair by hand against the commit that actually shipped:
      #
      #   git tag -a dev-v<version> <sha> -m "freesolo-flash-dev <version>" && git push origin dev-v<version>
      #
      # Auto-tagging every already-published dev commit would be worse than the gap it closes:
      # ordinary dev pushes deliberately reuse the current version, so it would tag whichever later
      # commit happened to run, recording a commit that was never in that version.
      - name: Tag the released dev version
        if: steps.decide.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          tag="dev-v${VERSION}"
          # Re-checked here after the preflight above, to catch a tag that appeared DURING the
          # publish. It matters more on this channel: the tag is the ONLY record of which commit went
          # into a given dev version, so one pointing at the wrong commit is a false provenance
          # record, not a cosmetic problem.
          # No `|| true`: `git ls-remote` exits 0 for BOTH "tag present" and "tag absent", and
          # non-zero only when the lookup itself failed (unreachable remote, auth). Swallowing that
          # would turn a network blip into "no tag exists" and wave the release through unvalidated,
          # so a failed lookup must fail the step.
          # `rc` is captured on the same line: inside `if ! ...`, a later `$?` reports the negation's
          # result (always 0), not git's.
          existing="$(git ls-remote --tags origin "refs/tags/${tag}" "refs/tags/${tag}^{}")" && rc=0 || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::Could not query tags on origin (git ls-remote exit ${rc}). Refusing to continue: a failed lookup is not proof that ${tag} is free."
            exit 1
          fi
          if [ -n "$existing" ]; then
            peeled="$(printf '%s\n' "$existing" | awk '$2 ~ /\^\{\}$/ {print $1; exit}')"
            plain="$(printf '%s\n' "$existing" | awk '$2 !~ /\^\{\}$/ {print $1; exit}')"
            target="${peeled:-$plain}"
            if [ "$target" != "$GITHUB_SHA" ]; then
              echo "::error::Tag ${tag} already exists on origin but points at ${target}, not this commit (${GITHUB_SHA}). The dev tag is the only record of which commit shipped in a given version; refusing to leave a false one. Resolve the tag by hand."
              exit 1
            fi
            echo "::notice::Tag ${tag} already exists and points at this commit; nothing to do."
            exit 0
          fi
          git config user.name "David Shan"
          git config user.email "78061174+DavidBShan@users.noreply.github.com"
          git tag -a "${tag}" -m "freesolo-flash-dev ${VERSION}"
          git push origin "${tag}"
