name: Set up hash-verified uv
description: Install the centralized uv version after verifying its Linux x86_64 release archive.

inputs:
  python-version:
    description: The Python version installed for the workflow.
    required: false
    default: ""
  enable-cache:
    description: Whether the uv dependency cache should be restored and saved.
    required: false
    default: "auto"

runs:
  using: composite
  steps:
    - name: Set up Python
      if: inputs.python-version != ''
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install verified uv
      id: toolchain
      shell: bash --noprofile --norc -euo pipefail {0}
      env:
        RUNNER_OS: ${{ runner.os }}
        RUNNER_ARCH: ${{ runner.arch }}
        TOOLCHAIN_PATH: ${{ github.action_path }}/../../../uv-toolchain.json
      run: ${{ github.action_path }}/install.sh

    - name: Restore uv dependency cache
      if: inputs.enable-cache != 'false'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: /dev/shm/flash-uv-cache
        key: uv-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.version }}-${{ hashFiles('**/uv.lock') }}
        restore-keys: |
          uv-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.version }}-
