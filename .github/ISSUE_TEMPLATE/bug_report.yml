name: Bug report
description: Something in Flash behaves incorrectly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste API keys, tokens, or credentials. Redact them before posting.
        For security vulnerabilities, use private reporting instead (see SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: |
        The exact command you ran, and the training TOML if one is involved
        (with credentials removed). This is usually the most useful part of the report.
      render: shell
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Paste the relevant output. Redact credentials.
      render: shell
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Flash version
      description: "`flash --version`, or the commit sha if running from source."
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Where does this happen
      options:
        - CLI (client)
        - Control plane (flash-server)
        - GPU worker / training
        - Serving / deploy / chat
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: How are you running Flash
      options:
        - Against the hosted Freesolo service
        - Self-hosted control plane
        - Local checkout / tests only
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Python and OS
      description: "e.g. Python 3.11 on Ubuntu 22.04"
    validations:
      required: false
