version: 2
updates:
  # Keep the CI actions current; pinned action majors go stale silently otherwise.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci

  # Security-relevant python deps. Grouped so a routine bump is one PR, not ten.
  #
  # `uv`, not `pip`: the resolved versions CI actually installs live in the committed uv.lock
  # (ci.yml runs `uv sync`), and the pip ecosystem does not read a lockfile. Most of pyproject
  # is unconstrained or lower-bound-only, so under pip there is little in the manifest to bump
  # and the versions that matter would never move. Caveat: with a [dependency-groups] table
  # present (pyproject.toml), the uv ecosystem updates uv.lock but not pyproject.toml
  # (dependabot-core#12788), so expect lockfile bumps rather than manifest bumps.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      python-deps:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Worker-side ML stack: pinned deliberately to match the baked worker images and
      # kernel cache. Bumping these needs a GPU re-bake, not an automated PR.
      - dependency-name: torch
      - dependency-name: vllm
      - dependency-name: transformers
      - dependency-name: peft
      - dependency-name: bitsandbytes
      - dependency-name: accelerate
      # tokenizers belongs to that same stack, and it cannot move on its own anyway: every
      # transformers 5.x release (5.15 included) requires tokenizers>=0.22.0,<=0.23.0, and there
      # is no stable 0.23.0 -- the line goes 0.22.2 -> 0.23.1. So the newest tokenizers a
      # transformers pin admits is the 0.22.2 already locked, and the bump dependabot keeps
      # retrying resolves to `your project's requirements are unsatisfiable`. Left un-ignored the
      # weekly uv job fails on it forever, which trains everyone to ignore dependabot output.
      # tokenizers moves with transformers during a re-bake, not by itself.
      - dependency-name: tokenizers
